name: Android APK

# Construit l'application Android (Capacitor) et publie un APK téléchargeable
# dans les artefacts du run — installation libre sur Android, sans Play Store.
#
# La compilation nécessite le SDK Android, absent de l'environnement de
# développement : elle est donc déléguée aux runners GitHub (SDK préinstallé).
#
# Secrets facultatifs pour un APK de release signé (sinon APK de debug) :
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build web app (statique)
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      # Source unique de vérité : android/app/build.gradle (identique à ce que
      # F-Droid compile et à ce que son robot de mise à jour relit aux tags).
      - name: Compute version
        id: version
        run: |
          GRADLE_FILE=android/app/build.gradle
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' "$GRADLE_FILE")
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' "$GRADLE_FILE")
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          # Garde-fou : versionName doit rester aligné sur package.json.
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION_NAME" != "$PKG_VERSION" ]; then
            echo "::error::versionName '$VERSION_NAME' (build.gradle) != version '$PKG_VERSION' (package.json)"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # Les secrets sont interdits dans un `if` : on expose le résultat via une sortie.
      - name: Detect signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      # APK de release signé si un keystore est fourni, sinon APK de debug
      # (auto-signé par Android, installable par sideload).
      - name: Build APK (release signée)
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build APK (debug)
        if: steps.signing.outputs.has_keystore != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        id: collect
        run: |
          set -euo pipefail
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          NAME="smokertrack-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          cp "$SRC" "$NAME"
          # Vérification minimale : l'APK doit être une archive zip non vide.
          test -s "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: smokertrack-apk-${{ steps.version.outputs.code }}
          path: ${{ steps.collect.outputs.apk }}
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### APK SmokeTracker"
            echo ""
            echo "- Version : ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})"
            echo "- Fichier : \`${{ steps.collect.outputs.apk }}\`"
            echo "- Taille : ${{ steps.collect.outputs.size }}"
            echo "- Signature : ${{ steps.signing.outputs.has_keystore == 'true' && 'release (keystore)' || 'debug (auto-signé)' }}"
            echo ""
            echo "Installation : télécharger l'artefact, autoriser « Installer des applications inconnues », ouvrir le fichier."
          } >> "$GITHUB_STEP_SUMMARY"
