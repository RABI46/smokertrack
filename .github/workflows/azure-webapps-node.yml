# Intégration continue + déploiement Azure App Service.
#
# Le déploiement ne s'exécute que si la variable de dépôt AZURE_WEBAPP_NAME est
# définie (Settings → Secrets and variables → Actions → Variables).
# Secrets requis pour déployer :
#   AZURE_WEBAPP_PUBLISH_PROFILE   contenu du profil de publication Azure
#   NEXT_PUBLIC_FIREBASE_*         configuration Firebase de production (6 valeurs)
name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  NEXT_TELEMETRY_DISABLED: '1'
  AZURE_WEBAPP_PACKAGE_PATH: '.deploy'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # Prépare un artefact autonome : la sortie "standalone" de Next, complétée
      # des fichiers statiques et du dossier public (sans node_modules ni .git).
      - name: Assemble deployable artifact
        run: |
          mkdir -p "$AZURE_WEBAPP_PACKAGE_PATH"
          cp -r .next/standalone/. "$AZURE_WEBAPP_PACKAGE_PATH"/
          mkdir -p "$AZURE_WEBAPP_PACKAGE_PATH/.next"
          cp -r .next/static "$AZURE_WEBAPP_PACKAGE_PATH/.next/static"
          cp -r public "$AZURE_WEBAPP_PACKAGE_PATH/public"
          ls -la "$AZURE_WEBAPP_PACKAGE_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Azure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    needs: quality
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: none
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          startup-command: 'node server.js'
